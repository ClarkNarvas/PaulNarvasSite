<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" fill="none">
  <defs>
    <linearGradient id="slat" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#000" stop-opacity=".5" />
      <stop offset=".5" stop-color="#000" stop-opacity="1" />
      <stop offset="1" stop-color="#000" stop-opacity=".5" />
    </linearGradient>
    <linearGradient id="falloff" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fff" stop-opacity=".5" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="horizontal-fade">
      <rect width="1600" height="1200" fill="url(#falloff)" />
    </mask>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="20" />
    </filter>
  </defs>
  <g filter="url(#soft)" mask="url(#horizontal-fade)" transform="rotate(-8 800 600)">
    <rect x="-180" y="10" width="1960" height="142" rx="34" fill="url(#slat)" />
    <rect x="-180" y="340" width="1960" height="142" rx="34" fill="url(#slat)" />
    <rect x="-180" y="670" width="1960" height="142" rx="34" fill="url(#slat)" />
    <rect x="-180" y="1000" width="1960" height="142" rx="34" fill="url(#slat)" />
  </g>
</svg>
