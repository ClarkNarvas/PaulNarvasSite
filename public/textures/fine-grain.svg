<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="4" seed="27" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.35" intercept="-.16" />
      <feFuncG type="linear" slope="1.35" intercept="-.16" />
      <feFuncB type="linear" slope="1.35" intercept="-.16" />
      <feFuncA type="table" tableValues="0 .68" />
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)" opacity=".82" />
</svg>
